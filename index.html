<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>IDOIR Gallery</title>
<style>
  /* Guest gallery viewer. Host this file anywhere (Vercel, Netlify, S3) at GALLERY_HOST.
     Set FUNCTION_URL below to your project's gallery Edge Function. */
  :root {
    --paper: #fbf8f2; --ink: #111; --espresso: #5d4037; --red: #800020; --champagne: #e6d5b4; --line: #e9e0d0;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #17130f; --ink: #f5f1e8; --espresso: #cbb9a8; --line: #3a3128; }
  }
  :root[data-theme="dark"] { --paper: #17130f; --ink: #f5f1e8; --espresso: #cbb9a8; --line: #3a3128; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--sans); }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 64px; }
  header { text-align: center; margin: 12px 0 28px; }
  .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; color: var(--espresso); }
  h1 { font: 400 clamp(32px, 7vw, 54px)/1.08 var(--serif); margin: 8px 0 6px; }
  .meta { color: var(--espresso); font-size: 14px; }
  .rule { width: 64px; height: 2px; background: var(--champagne); margin: 14px auto 0; border: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 14px; }
  figure { margin: 0; background: #0001; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  figure img, figure video { width: 100%; display: block; background: #000; }
  figcaption { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; font-size: 13px; color: var(--espresso); background: var(--paper); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; }
  a.dl { color: var(--red); font-weight: 600; text-decoration: none; padding: 6px 0; }
  .panel { max-width: 420px; margin: 40px auto; text-align: center; }
  .panel p { color: var(--espresso); }
  form { display: flex; gap: 8px; margin-top: 16px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border: 1.5px solid var(--champagne); border-radius: 10px; background: transparent; color: var(--ink); }
  button { font: 600 16px var(--sans); padding: 12px 18px; border: 0; border-radius: 10px; background: var(--red); color: #fff; }
  .error { color: #b3261e; font-size: 14px; min-height: 20px; margin-top: 8px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--red); border-radius: 50%; margin: 60px auto; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="spinner" role="status" aria-label="Loading"></div></main>
<script>
(() => {
  // ── Configure ──
  // Your project's Edge Function, e.g. https://abcdefghijklmnop.supabase.co/functions/v1/gallery
  const FUNCTION_URL = "https://sgimxuztsmhtkbhbnprn.supabase.co/functions/v1/gallery";

  const app = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  const slug = params.get("g") || "";
  const token = params.get("s");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const day = (iso) => new Date(iso).toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
  let passcode = "";
  try { passcode = sessionStorage.getItem("gallery-pass-" + slug) || ""; } catch (_) {}

  const panel = (title, body, extra = "") =>
    `<div class="panel"><div class="eyebrow">Event gallery</div><h1>${esc(title)}</h1><p>${body}</p>${extra}</div>`;

  async function load() {
    if (!slug) { app.innerHTML = panel("Gallery not found", "Check the link you were sent."); return; }
    const url = new URL(FUNCTION_URL);
    url.searchParams.set("g", slug);
    if (token) url.searchParams.set("s", token);
    let res, data;
    try {
      res = await fetch(url, { headers: passcode ? { "x-gallery-passcode": passcode } : {} });
      data = await res.json();
    } catch (_) {
      app.innerHTML = panel("Can't load the gallery", "Check your connection and refresh the page.");
      return;
    }
    if (res.status === 401) return askPasscode(data.name, !!passcode);
    if (res.status === 403) { app.innerHTML = panel(data.name, "This gallery is private. Open the link you were sent after your photo session to see your photos."); return; }
    if (res.status === 410) { app.innerHTML = panel(data.name, "This gallery has closed. Ask the host if you need a copy of your photos."); return; }
    if (!res.ok) { app.innerHTML = panel("Gallery not found", "Check the link you were sent."); return; }
    show(data);
  }

  function askPasscode(name, wrong) {
    app.innerHTML = panel(name || "Event gallery", "Enter the passcode from the host to see the gallery.",
      `<form id="pass"><label for="code" class="eyebrow" style="position:absolute;left:-9999px">Passcode</label>
        <input id="code" autocomplete="off" autocapitalize="off" placeholder="Passcode" required><button>View</button></form>
        <div class="error" id="err">${wrong ? "That passcode didn't work. Try again." : ""}</div>`);
    const input = document.getElementById("code");
    input.focus();
    document.getElementById("pass").addEventListener("submit", (e) => {
      e.preventDefault();
      passcode = input.value.trim();
      try { sessionStorage.setItem("gallery-pass-" + slug, passcode); } catch (_) {}
      app.innerHTML = '<div class="spinner" role="status" aria-label="Loading"></div>';
      load();
    });
  }

  function show(data) {
    const items = data.items || [];
    const labels = { photo: "Photo", gif: "GIF", boomerang: "Boomerang", testimonial: "Video message", clip: "Video" };
    const media = (item) => {
      const isVideo = item.contentType.startsWith("video/");
      const loops = item.kind === "boomerang" || item.kind === "clip";
      return isVideo
        ? `<video src="${esc(item.url)}" ${loops ? "autoplay muted loop" : "controls"} playsinline preload="metadata"></video>`
        : `<img src="${esc(item.url)}" alt="${esc(labels[item.kind] || "Photo")}" loading="lazy">`;
    };
    const download = (u) => u + (u.includes("?") ? "&" : "?") + "download=";
    app.innerHTML = `<header><div class="eyebrow">${data.scope === "session" ? "Your photos" : "Event gallery"}</div>
        <h1>${esc(data.name)}</h1>
        <div class="meta">${day(data.eventDate)} · Gallery open until ${day(data.expiresAt)}</div><hr class="rule"></header>
      ${items.length ? `<div class="grid">${items.map((item) => `<figure>${media(item)}
          <figcaption><span>${esc(labels[item.kind] || "Photo")}</span><a class="dl" href="${esc(download(item.url))}">Download</a></figcaption></figure>`).join("")}</div>`
        : `<div class="panel"><p>No photos yet. ${data.scope === "session" ? "Yours will appear here in a minute or two." : "Check back during the event."}</p></div>`}`;
  }

  load();
})();
</script>
</body>
</html>
